name: Build installable packages

on:
  workflow_dispatch:
    inputs:
      publish_npm_tag:
        description: 'Publish the npm beta installer for an existing published release (e.g. v0.1.215); leave blank to build packages'
        required: false
        type: string
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  macos:
    if: github.event_name != 'release' && inputs.publish_npm_tag == ''
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
      - run: npm ci
      - run: npm run media:build
      - run: npm run settings:window:build
      - run: npm run plugin:stage
      - run: npm run release:macos -- --zip
      - name: Verify package contents
        run: |
          archive=$(find release -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$archive"
          ditto -x -k "$archive" "$RUNNER_TEMP/voicemesh-verify"
          package=$(find "$RUNNER_TEMP/voicemesh-verify" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -x "$package/runtime/node"
          test -f "$package/plugin-marketplace/.claude-plugin/marketplace.json"
          test -d "$package/app/settings-window/src-tauri/target/release/bundle/macos/VoiceMesh Settings.app"
          test -f "$package/release.json"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.runner }}
          path: release/*.zip
          if-no-files-found: error

  windows:
    if: github.event_name != 'release' && inputs.publish_npm_tag == ''
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content .claude-plugin/plugin.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match Mod version $version" }
      - run: npm ci
      - run: npm run media:build
      - run: npm run settings:window:build
      - run: npm run plugin:stage
      - name: Build and archive Windows package
        shell: pwsh
        run: |
          $nodeDir = Split-Path (Get-Command node).Source
          npm run release:windows -- --node-dir "$nodeDir"
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed' }
          $version = (Get-Content .claude-plugin/plugin.json | ConvertFrom-Json).version
          $arch = node -p 'process.arch'
          $package = "voicemesh-claude-win-$arch"
          $archive = "$package-$version.zip"
          Push-Location release
          try {
            & 7z a -tzip $archive $package
            if ($LASTEXITCODE -ne 0) { throw 'Windows ZIP creation failed' }
            & 7z t $archive
            if ($LASTEXITCODE -ne 0) { throw 'Windows ZIP verification failed' }
            $hasMarketplace = & 7z l $archive | Select-String -SimpleMatch '.claude-plugin' -Quiet
            if (-not $hasMarketplace) { throw 'Bundled marketplace metadata is missing from ZIP' }
          } finally { Pop-Location }
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows-x64
          path: release/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Create draft release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release-assets
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          sha256sum ./*.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./*.zip SHA256SUMS --draft --title "VoiceMesh Claude Mod $GITHUB_REF_NAME" --generate-notes

  npm:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_npm_tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.publish_npm_tag }}
    steps:
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify installer version and published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./npm-installer/package.json').version")
          test "$RELEASE_TAG" = "v$version"
          test "$version" = "$(node -p "require('./.claude-plugin/plugin.json').version")"
          gh release view "$RELEASE_TAG" --json isDraft,assets > "$RUNNER_TEMP/npm-release.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const release = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/npm-release.json`, 'utf8'))
          assert.equal(release.isDraft, false, 'Release must be published before npm')
          const version = process.env.RELEASE_TAG.slice(1)
          for (const name of ['SHA256SUMS', `voicemesh-claude-macos-arm64-${version}.zip`,
            `voicemesh-claude-macos-x64-${version}.zip`, `voicemesh-claude-win-x64-${version}.zip`]) {
            assert.ok(release.assets.some(asset => asset.name === name && asset.state === 'uploaded'), `Missing release asset: ${name}`)
          }
          JS
      - name: Publish beta installer with npm trusted publishing
        working-directory: npm-installer
        run: npm publish --tag beta --access public
