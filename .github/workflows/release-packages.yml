name: Build installable packages

on:
  workflow_dispatch:
    inputs:
      publish_npm_tag:
        description: 'Publish the npm installer for an existing published release (e.g. v0.1.215); leave blank to build packages'
        required: false
        type: string
      sync_tags_only:
        description: 'Synchronize npm latest and beta for publish_npm_tag without republishing'
        required: false
        type: boolean
        default: false
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  macos:
    if: github.event_name != 'release' && inputs.publish_npm_tag == ''
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
      - run: npm ci
      - run: npm run media:build
      - run: npm run settings:window:build
      - run: npm run plugin:stage
      - run: npm run release:macos -- --zip
      - name: Verify package contents
        run: |
          archive=$(find release -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$archive"
          ditto -x -k "$archive" "$RUNNER_TEMP/voicemesh-verify"
          package=$(find "$RUNNER_TEMP/voicemesh-verify" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test ! -e "$package/runtime"
          test ! -e "$package/app/node_modules"
          test ! -e "$package/app/vendor"
          test -f "$package/app/host/server.js"
          test -f "$package/app/scripts/launch-host.sh"
          node "$package/app/scripts/node-requirement.cjs"
          node --test tests/system-node.test.mjs tests/npm-installer-output.test.mjs tests/uninstall-cleanup.test.mjs tests/windows-release.test.mjs tests/desktop-lifecycle.test.mjs
          test -f "$package/plugin-marketplace/.claude-plugin/marketplace.json"
          test -d "$package/app/settings-window/src-tauri/target/release/bundle/macos/VoiceMesh Settings.app"
          test -f "$package/release.json"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.runner }}
          path: release/*.zip
          if-no-files-found: error

  windows:
    if: github.event_name != 'release' && inputs.publish_npm_tag == ''
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content .claude-plugin/plugin.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match Mod version $version" }
      - run: npm ci
      - run: npm run media:build
      - run: npm run settings:window:build
      - run: npm run plugin:stage
      - name: Build and archive Windows package
        shell: pwsh
        run: |
          npm run release:windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed' }
          $version = (Get-Content .claude-plugin/plugin.json | ConvertFrom-Json).version
          $arch = node -p 'process.arch'
          $package = "voicemesh-claude-win-$arch"
          foreach ($excluded in @('runtime', 'app\node_modules', 'app\vendor')) {
            if (Test-Path "release\$package\$excluded") { throw "Unexpected packaged directory: $excluded" }
          }
          node --test tests/system-node.test.mjs tests/npm-installer-output.test.mjs tests/windows-release.test.mjs tests/windows-installer.test.mjs tests/windows-process.test.mjs tests/desktop-lifecycle.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installer regression checks failed' }
          $archive = "$package-$version.zip"
          Push-Location release
          try {
            & 7z a -tzip $archive $package
            if ($LASTEXITCODE -ne 0) { throw 'Windows ZIP creation failed' }
            & 7z t $archive
            if ($LASTEXITCODE -ne 0) { throw 'Windows ZIP verification failed' }
            $hasMarketplace = & 7z l $archive | Select-String -SimpleMatch '.claude-plugin' -Quiet
            if (-not $hasMarketplace) { throw 'Bundled marketplace metadata is missing from ZIP' }
          } finally { Pop-Location }
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows-x64
          path: release/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Create draft release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release-assets
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          sha256sum ./*.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./*.zip SHA256SUMS --draft --title "VoiceMesh Claude Mod $GITHUB_REF_NAME" --generate-notes

  npm:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_npm_tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.publish_npm_tag }}
    steps:
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted-publisher dist-tag support
        run: npm install --global npm@11.21.0
      - name: Verify installer version and published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./npm-installer/package.json').version")
          test "$RELEASE_TAG" = "v$version"
          test "$version" = "$(node -p "require('./.claude-plugin/plugin.json').version")"
          gh release view "$RELEASE_TAG" --json isDraft,assets > "$RUNNER_TEMP/npm-release.json"
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP/npm-checksums"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync, writeFileSync } from 'node:fs'
          const release = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/npm-release.json`, 'utf8'))
          assert.equal(release.isDraft, false, 'Release must be published before npm')
          const version = process.env.RELEASE_TAG.slice(1)
          const sums = new Map(readFileSync(`${process.env.RUNNER_TEMP}/npm-checksums/SHA256SUMS`, 'utf8')
            .trim().split(/\r?\n/).map(line => {
              const match = /^([a-f0-9]{64})\s+\*?(?:\.\/)?(.+)$/.exec(line)
              assert.ok(match, 'Invalid SHA256SUMS entry')
              return [match[2], match[1]]
            }))
          const checksums = {}
          for (const [platform, archive] of Object.entries({
            'darwin-arm64': `voicemesh-claude-macos-arm64-${version}.zip`,
            'darwin-x64': `voicemesh-claude-macos-x64-${version}.zip`,
            'win32-x64': `voicemesh-claude-win-x64-${version}.zip`,
          })) {
            const asset = release.assets.find(asset => asset.name === archive && asset.state === 'uploaded')
            assert.ok(asset, `Missing release asset: ${archive}`)
            const checksum = sums.get(archive)
            assert.ok(checksum && asset.digest === `sha256:${checksum}`, `Release digest mismatch: ${archive}`)
            checksums[platform] = checksum
          }
          const path = 'npm-installer/install.mjs'
          const source = readFileSync(path, 'utf8')
          const pattern = /const checksums = \{[^}]*\}/
          assert.ok(pattern.test(source), 'Installer checksum table missing')
          writeFileSync(path, source.replace(pattern, `const checksums = ${JSON.stringify(checksums, null, 2)}`))
          JS
      - name: Publish latest installer with npm trusted publishing
        if: inputs.sync_tags_only != true
        working-directory: npm-installer
        run: npm publish --tag latest --access public
      - name: Synchronize current and legacy npm channels
        run: |
          version="${RELEASE_TAG#v}"
          npm dist-tag add "claude-voice-mod@$version" latest
          npm dist-tag add "claude-voice-mod@$version" beta
      - name: Mark published GitHub release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --prerelease=false --latest
      - name: Verify public update channels agree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { setTimeout } from 'node:timers/promises'
          const expected = process.env.RELEASE_TAG.slice(1)
          async function json(url, headers = {}) {
            const response = await fetch(`${url}?verification=${Date.now()}`, {
              headers: { Accept: 'application/json', 'Cache-Control': 'no-cache', ...headers },
              signal: AbortSignal.timeout(10000),
            })
            assert.ok(response.ok, `Update endpoint returned ${response.status}`)
            return response.json()
          }
          // 0.1.226 reached the public registry after the former three-minute window.
          for (let attempt = 0; ; attempt++) {
            try {
              const [tags, npm, github] = await Promise.all([
                json('https://registry.npmjs.org/-/package/claude-voice-mod/dist-tags'),
                json('https://registry.npmjs.org/claude-voice-mod/latest'),
                json('https://api.github.com/repos/hopetonp/claude-voice-mod/releases/latest', {
                  Authorization: `Bearer ${process.env.GH_TOKEN}`,
                }),
              ])
              assert.equal(tags.latest, expected, 'npm latest is stale')
              assert.equal(tags.beta, expected, 'npm beta is stale')
              assert.equal(npm.version, expected, 'npm default package version is stale')
              assert.equal(github.tag_name, `v${expected}`, 'GitHub latest is stale')
              console.log(`Verified npm latest, npm beta, default package, and GitHub latest: ${expected}`)
              break
            } catch (error) {
              if (attempt >= 59) throw error
              console.log(`Waiting for public update channels: ${error.message}`)
              await setTimeout(10000)
            }
          }
          JS
