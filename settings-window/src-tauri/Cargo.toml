[package]
name = "voicemesh-settings-window"
version = "0.1.0"
edition = "2021"
description = "VoiceMesh settings window for Claude Desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
voicemesh-desktop = { path = "../../node_modules/@voicemesh/composer/native/settings-window" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
