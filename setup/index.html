<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VoiceMesh settings</title>
<script>
  const requestedTheme = new URLSearchParams(location.search).get('theme')
  document.documentElement.dataset.theme = requestedTheme === 'dark' ||
    (requestedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'
</script></head>
<body><div id="app"></div><script type="module" src="/main.tsx"></script></body></html>
